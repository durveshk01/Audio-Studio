<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090d" />
    <title>Audio Studio connection</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #f7f5fb; background: #09090d; font: 16px/1.5 system-ui, sans-serif; }
      main { width: min(460px, 100%); padding: 30px; border: 1px solid rgba(255,255,255,.12); border-radius: 20px; background: #14141c; }
      h1 { margin: 0 0 10px; font-size: 1.55rem; }
      p { color: #aaa8b5; }
      a { display: inline-flex; margin-top: 12px; padding: 10px 16px; border-radius: 999px; color: #171320; background: #c2adff; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Audio Studio can’t connect</h1>
      <p>Start Audio Studio on your computer and connect your phone to the same Wi-Fi network. If your computer’s network address changed, update <code>CAPACITOR_SERVER_URL</code> and rebuild the app.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
