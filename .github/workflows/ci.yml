name: Audio Studio CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build-and-test:
    name: Build & Test Web Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Suites
        run: npm test

      - name: Check Types and Lint
        run: npm run typecheck && npm run lint

      - name: Verify Audio Processing & ID3 Engine
        run: npm run verify:audio

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verify Real FFmpeg Compression
        run: npm run verify:ffmpeg

      - name: Build Web Client Bundle
        run: npm run build:client

      - name: Build Express Server
        run: npm run build:server

      - name: Install Browser for Workflow Tests
        run: npx playwright install --with-deps chromium

      - name: Verify Desktop and Mobile Audio Workflows
        run: npx playwright test

  python-metatune-test:
    name: Test MetaTune Microservice
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r metatune/requirements.txt

      - name: Run MetaTune Unit Tests
        env:
          PYTHONPATH: metatune
        run: python -m unittest discover -s metatune/tests

  android-build:
    name: Verify Android Release on Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [web-build-and-test]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Android Build Tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install FFmpeg for Native Test Fixtures
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Create Disposable CI Signing Key
        run: npm run android:signing

      - name: Build and Check Non-Debuggable Offline Release APK
        run: npm run android:apk

      - name: Enable Emulator Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Exercise Packaged UI and Native Audio on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: npm run android:test

      - name: Archive CI Release and Runtime Verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-studio-android-ci-release
          path: |
            artifacts/apk/Audio-Studio-Release.apk*
            artifacts/android-tests/*.txt
            artifacts/android-tests/*.json
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-release.html
          retention-days: 14
