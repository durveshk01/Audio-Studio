name: Audio Studio CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-build-and-test:
    name: Build & Test Web Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Suites
        run: npm test

      - name: Verify Audio Processing & ID3 Engine
        run: npx tsx scripts/verify-audio-processing.ts

      - name: Build Web Client Bundle
        run: npm run build:client

      - name: Build Express Server
        run: npm run build:server

  python-metatune-test:
    name: Test MetaTune Microservice
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r metatune/requirements.txt

      - name: Run MetaTune Unit Tests
        env:
          PYTHONPATH: metatune
        run: python -m unittest discover -s metatune/tests

  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [web-build-and-test]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Assets for Capacitor
        run: npm run build:client

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Assemble Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Archive Android APK
        uses: actions/upload-artifact@v4
        with:
          name: audio-studio-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
